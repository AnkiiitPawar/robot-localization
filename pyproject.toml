[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-localization"
version = "0.1.0"
description = "EKF, UKF and particle-filter robot localisation with consistency checks"
authors = [{ name = "Ankit Pawar" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools]
packages = ["loc"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
